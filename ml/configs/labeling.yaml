# Config for label_with_sam3.py, score_probe.py, and masks_to_labels.py.
#
# Multi-class taxonomy (see masks_to_labels.py): SAM3 prompts stay generic
# (no left/right/1st/2nd wording -- SAM3 grounds visual/semantic concepts,
# not spatial instructions like "the one on the right"). Left-vs-right and
# lane-1-vs-lane-2 assignment happens in masks_to_labels.py by comparing
# each connected blob's x-position after merging same-prompt instances --
# much more reliable than hoping a text prompt encodes spatial position.

prompts:
  solid_line: "white solid lane line"   # -> class 1 (all solid pixels, no left/right split)
  dashed_line: "white dashed lane line" # -> class 2
  lane_area: "asphalt road lane"        # -> class 3 (region between the solid lines, not split)

# Class index written into the single-channel label PNG (0 = background).
# Deliberately simple -- 3 foreground classes, no left/right or lane-1/lane-2
# distinction. The left/right solid classification and the lane_1/lane_2
# split were dropped because SAM3's detections weren't reliable enough to
# get them right, and getting them wrong is worse than not making the
# distinction. Lines are layered on top of the area at overlaps (see
# masks_to_labels.py).
class_ids:
  solid_line: 1
  dashed_line: 2
  lane_area: 3

# label_with_sam3.py's SAM3-side capture floor (an instance scoring below
# this is never even saved, regardless of prompt) -- must be <= the lowest
# value in class_min_score below, since anything captured below its own
# class's min_score just gets filtered out later for free, but anything
# never captured at all can only be recovered by re-running SAM3.
capture_threshold: 0.15

# masks_to_labels.py's default --min-score, per prompt category. Lowered
# from a uniform 0.3 after score_distribution.py on the full 36752-frame
# sam3_raw showed 0.3 was dropping real detections:
#   - dashed_line: at 0.3, 36% of frames (10971/30577) lost their dashed
#     line ENTIRELY -- and dashed is the boundary the lane_1/lane_2 split
#     is built on (see masks_to_labels.py), so losing it silently reverts
#     that frame to the image-center fallback. ~0.20 keeps the best dashed
#     instance in ~90% of frames, so 0.20 it is.
#   - solid_line: 86% of frames kept their best solid at 0.3, but the
#     SECOND solid line (left vs right) often sat in the 0.25-0.30 gap and
#     got dropped, leaving only one side labeled. Lowered to 0.25 -- but
#     kept above dashed since solid lines are the ones most easily confused
#     with parking-lot lines, so being less permissive here limits those
#     false positives.
#   - lane_area: left at the 0.15 floor -- score_distribution showed only
#     39% of frames detect asphalt AT ALL, and nothing is captured below
#     0.15 to recover, so this is a SAM3/prompt limitation, not a threshold
#     one (lowering can't help). Needs a separate prompt/detection fix.
# After changing these, rerun masks_to_labels.py (free, no SAM3 rerun) and
# eyeball the result -- lower thresholds trade recall for more false
# positives (esp. solid vs. parking lines).
class_min_score:
  solid_line: 0.25
  dashed_line: 0.20
  lane_area: 0.15

# masks_to_labels.py only: drop mask pixels above this row fraction
# (ceiling/walls -- never floor).
roi_top_ratio: 0.45

# Shape filter for line prompts (solid_line/dashed_line) -- cv2.minAreaRect
# on each instance's mask contour, after the ROI crop above. Rejects blobby
# false positives (hands, shoes, glare) that aren't line-shaped. NOT
# applied to lane_area instances (a lane surface is wide, not elongated --
# see lane_area_min_area_px instead).
line_min_aspect_ratio: 3.0
line_min_length_px: 30.0  # shorter than lane_detector.yaml's 60px on purpose:
                            # a single SAM3 instance is often just one dash

# Shape filter for the lane_area prompt -- minimum blob area in pixels
# (post-ROI-crop, pre-resize) to reject small stray patches that aren't a
# real lane surface. Not an aspect-ratio filter since a lane region is a
# wide blob, not a thin line.
lane_area_min_area_px: 5000

# masks_to_labels.py: same-prompt instances whose masks overlap above this
# IoU are collapsed to the single highest-scoring one before merging
# (avoids near-duplicate SAM3 detections of the same physical line/area).
iou_dedup_threshold: 0.5
