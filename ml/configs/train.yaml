# Config for train.py (and read back by any future compare/deploy tooling
# via the saved checkpoint's embedded copy of this config, so the two stay
# in sync automatically -- image_size/base_channels/num_classes must match
# what a checkpoint was actually trained with).
#
# Single candidate architecture: PIDNetLite (pidnet.py) -- see its
# docstring for why the boundary-aware design was picked directly for this
# multi-class task (solid vs. dashed, left vs. right, lane_1 vs. lane_2 are
# all boundary-distinction problems).

image_size: [288, 512]  # [H, W] -- downsized from the source 1080x1920.
                          # Raise this later only if thin/distant lines are
                          # visibly lost at this size in val snapshots.
# crop_bottom_fraction: dataset.py supports cropping to only the bottom N%
# of each frame before resizing (an ROI-restriction idea considered and
# shelved for now -- full frame it is). Defaults to 1.0 (no crop) if unset.

num_classes: 4  # background(0) + left_solid(1) + center_dashed(2) + right_solid(3)
                 # -- classes come from label/lane_dataset masks (SSE polygons via
                 # label/polygons_to_masks.py), NOT the old SAM3 labeling.yaml scheme.

batch_size: 8   # ⚠ lane_dataset has only 80 train imgs: with drop_last, batch 64
                #   gave floor(80/64)=1 batch/epoch = ~60 total steps -> model never
                #   learned (val IoU ~0.005). batch 8 -> 10 batches/epoch. Raise back
                #   toward 32-64 only once the dataset is large again.
# (was 64) raised from 12 (which was sized for a 4GB laptop GPU) --
                  # this model is only ~1.6M params, a 3090's 24GB has huge
                  # headroom at 288x512. If this OOMs, back off in steps
                  # (48/32/24); if GPU util (nvidia-smi -l 1 while training)
                  # still isn't near 100%, the bottleneck is data loading,
                  # not batch size -- see num_workers below instead.
epochs: 120  # small dataset -> few steps/epoch, so more epochs (was 60)
lr: 0.001
weight_decay: 0.0001

# Mixed precision (fp16 autocast + loss scaling) -- throughput win on the
# 3090's tensor cores, auto-disabled on CPU. Set false only if a numerical
# issue is suspected (loss going NaN that fp32 doesn't).
amp: true
# Gradient-norm clip. null = off. A small value (e.g. 5.0) caps occasional
# loss spikes from the heavily-weighted boundary term -- only add it if the
# loss curve is visibly unstable, it's not needed by default.
grad_clip: null

base_channels: 32   # PIDNetLite's width multiplier -- ~1.5M params at
                      # num_classes=4 (see pidnet.py's __main__ check)
aux_weight: 0.4      # deep-supervision loss weight on the I/context
                       # branch's own (lower-res) prediction
boundary_weight: 20.0  # boundary BCE weight -- kept high since boundary
                       # pixels (see losses.extract_boundary) are a tiny
                       # minority even within the already-sparse foreground
                       # mask; too low and the boundary branch just learns
                       # all-background

ce_weight: 0.5    # weights for the MAIN segmentation loss term (both here
dice_weight: 0.5   # and inside val_criterion, which is always plain
                     # CEDice regardless of future architecture changes,
                     # for cross-run comparability)

# Optional per-class weight for the cross-entropy term, index-matched to
# the mask classes (0=background, 1=left_solid, 2=center_dashed, 3=right_solid).
# Left unset
# (null) to start -- background dominates pixel count but Dice already
# counterweights that; only add this if a specific class (e.g. the thin
# dashed line) is visibly underperforming in val snapshots/per-class IoU.
class_weights: null

num_workers: 12  # raised from 8 -- each train sample does a cv2 resize +
                   # rotation warpAffine + brightness/gamma jitter (see
                   # dataset.py's _augment), which is CPU-bound and, with
                   # ~30k train frames/epoch, is a plausible bottleneck
                   # independent of GPU speed. Tune against the desktop's
                   # actual core count (`nproc`) -- if raising this doesn't
                   # help GPU utilization either, the fix is lighter/fewer
                   # augmentation ops, not more workers.
snapshot_every_n_epochs: 5
num_val_snapshots: 4      # fixed val frames to render input|ground-truth|
                            # prediction snapshots for each time this fires

# Whitelist mode: only train/val on frames whose label was eyeballed and
# approved via ml/labeling/review_labels_interactive.py (listed in
# ml/data/verified_frames.txt). Default false uses every frame in the
# split; leave it false until manual review actually covers enough of the
# dataset, since true before that shrinks training to whatever small
# fraction has been verified so far.
require_verified: false
