# Parameters for autodrive_vehicle.
#
# Steering is CLOSED-LOOP in the firmware now (mega_steer_closed_loop.ino,
# POT on A6). The host sends a target angle; the firmware servos to it. The
# steer_* calibration below MIRRORS the Arduino's EEPROM calibration (from
# its CAL sweep) so the ROS side can map angle <-> ADC the same way:
#   adc_min/adc_max : mechanical end-stops (CAL after pot swap: 136 .. 867)
#   adc_center      : POT reading with wheels straight (~501, CAL midpoint)
#   max_angle_rad   : end-stop steering angle (user estimate ~20 deg = 0.35 rad,
#                     approximate -- tune if a better number is found)
#   increase_adc_is_left : higher ADC == left (measured: yes)
# Keep these in sync with the Arduino EEPROM after any CAL.
arduino_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"    # confirmed on the actual vehicle 2026-07-27
    baudrate: 115200
    speed_to_pwm_gain: 0.0   # TODO: (m/s) -> throttle PWM, until the drive
                              # motor is characterized against real speed
    max_throttle_pwm: 0      # TODO: safe drive PWM ceiling, once known
    steer_adc_min: 136
    steer_adc_max: 867
    steer_adc_center: 501
    steer_max_angle_rad: 0.35
    steer_increase_adc_is_left: true

# steering_pid_node is DEPRECATED (loop moved into the firmware) and no longer
# launched -- see steering_pid_node.py. Its old kp/ki/kd/angle_to_pwm_gain
# params are gone.

# Manual driving -- talks to the Arduino directly, see keyboard_teleop_node.py.
# Run this INSTEAD OF arduino_bridge_node, never alongside it (both would fight
# over the same serial port). REVERTED TO PULSE steering (the potentiometer
# broke): a/d fire one-shot ST pulses against the open-loop firmware
# (mega_motor_controller.ino), not held closed-loop targets. The closed-loop
# code (mega_steer_closed_loop.ino, steering_pot.py) is kept for when a new
# pot is installed.
keyboard_teleop_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"    # same value as arduino_bridge_node.serial_port above
    baudrate: 115200
    throttle_step: 20        # PWM units per w/s press
    max_throttle_pwm: 120     # manual-drive ceiling (firmware MAX_DRIVE_PWM is 180)
    steer_step: 150           # PWM units per a/d pulse (40 was too weak to move)
    steer_pulse_duration_ms: 250  # firmware MAX_STEER_DURATION_MS ceiling
