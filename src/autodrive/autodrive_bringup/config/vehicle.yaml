# Placeholder parameters for autodrive_vehicle.
# TODO: confirm the real serial port and baud rate before deploying.
#
# steer_pulse_duration_ms is duplicated between the two node sections below
# on purpose -- /vehicle/steering_pwm (std_msgs/Float32) only carries a PWM
# value, not a duration, so both nodes read the same config value instead of
# a custom message type. Keep them equal if you change one.
arduino_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"    # confirmed on the actual vehicle 2026-07-27
    baudrate: 115200
    speed_to_pwm_gain: 0.0   # TODO: (m/s) -> throttle PWM, until the drive
                              # motor is characterized against real speed
    max_throttle_pwm: 0      # TODO: safe drive PWM ceiling, once known
    steer_pulse_duration_ms: 0  # TODO: must match steering_pid_node below

steering_pid_node:
  ros__parameters:
    # TODO: unused until a real steering feedback sensor is installed --
    # see steering_pid_node.py. Tune once the sensor exists.
    kp: 0.0
    ki: 0.0
    kd: 0.0
    # Open-loop angle -> steering pulse mapping used until then.
    angle_to_pwm_gain: 0.0   # TODO: (rad) -> steer PWM, once motor is characterized
    max_steer_pwm: 0         # TODO: safe steering PWM ceiling, once known
    steer_pulse_duration_ms: 0  # TODO: must match arduino_bridge_node above

# Manual driving -- talks to the Arduino directly (raw PWM, no gain
# characterization needed), see keyboard_teleop_node.py's module docstring
# for why this bypasses arduino_bridge_node's topic chain instead of going
# through it. Run this INSTEAD OF arduino_bridge_node, never alongside it
# (both would fight over the same serial port) -- copy serial_port from
# arduino_bridge_node above once it's filled in.
keyboard_teleop_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"    # same value as arduino_bridge_node.serial_port above
    baudrate: 115200
    throttle_step: 20        # PWM units per w/s press
    max_throttle_pwm: 60      # conservative manual-test ceiling -- raise only
                                # after confirming this is safe on blocks/low
                                # speed, independent of max_throttle_pwm above
                                # (that one's still an unset 0 placeholder)
    steer_step: 40            # PWM units per a/d pulse
    steer_pulse_duration_ms: 150
